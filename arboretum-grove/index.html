*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050810;color:#ece9e2;font:14px/1.5 system-ui,sans-serif}canvas{display:block;touch-action:none;width:100%;height:100%}header{position:fixed;z-index:2;top:0;left:0;right:0;padding:max(20px,env(safe-area-inset-top)) 24px 0;pointer-events:none}a,button{pointer-events:auto;color:inherit}a{font-size:12px;text-decoration:none;opacity:.75}h1{font-weight:400;font-size:clamp(26px,4vw,40px);letter-spacing:-.035em;margin:25px 0 3px}header p{margin:0;color:#9ca6b8;font-size:12px}.controls{position:fixed;z-index:2;bottom:max(24px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;justify-content:space-between;align-items:end;gap:20px;pointer-events:none}.caption{max-width:420px;font-size:11px;color:#9ca6b8}.caption p{margin:4px 0}.buttons{display:flex;gap:7px}.buttons button{min-height:44px;min-width:44px;border:1px solid #ffffff30;background:#101726dd;border-radius:24px;font:14px system-ui;padding:0 15px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #e6b77a;outline-offset:4px}#status{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(85vw,340px);text-align:center;color:#c0bbce;background:#0e1424ed;padding:20px;border-radius:14px}#status a{display:block;margin-top:12px;text-decoration:underline}.fallback{position:fixed;inset:0;width:100%;height:100%;object-fit:contain}@media(max-width:600px){header{padding-left:18px;padding-right:18px}h1{margin-top:20px;font-size:28px}.controls{left:18px;right:18px;flex-direction:column;align-items:start;gap:12px}.caption{max-width:280px;font-size:10px}.buttons{align-self:flex-end}.buttons button{padding:0 13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body>
<img class="fallback" id="poster" src="preview.webp" alt="Luminous violet, amber, and cyan points revealing a grove at the Washington Park Arboretum.">
<header><a href="../lidar-studies.html#seattle">← LiDAR studies</a><h1>Arboretum / Luminous grove</h1><p>Seattle · 193,555 laser returns</p></header>
<div id="status" role="status">Loading the grove · 1.55 MB</div>
<div class="controls"><div class="caption"><p>Drag to orbit · Pinch or scroll to zoom · Two fingers to pan</p><p>Canopy expands and returns · Ground stays still</p><p>King County West 2021 LiDAR · Artistic height colors</p></div><div class="buttons"><button id="motion" aria-pressed="false">Pause motion</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="reset">Reset view</button></div></div>
<script type="module">
const status=document.getElementById('status');
try {
const THREE=await import('three'),{OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const [meta,response]=await Promise.all([fetch('points.json').then(r=>{if(!r.ok)throw Error('Metadata unavailable');return r.json()}),fetch('points.bin')]);
if(!response.ok)throw Error('Point data unavailable');const buffer=await response.arrayBuffer();if(buffer.byteLength!==meta.count*8)throw Error('Incomplete point data');
const packed=new Uint16Array(buffer),positions=new Float32Array(meta.count*3),heights=new Uint16Array(meta.count);
for(let i=0;i<meta.count;i++){for(let k=0;k<3;k++)positions[i*3+k]=packed[i*4+k]/65535*meta.span[k]+meta.min[k];heights[i]=packed[i*4+3]}
const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.setAttribute('heightColor',new THREE.BufferAttribute(heights,1,true));geometry.computeBoundingSphere();
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x050810);renderer.domElement.setAttribute('aria-label','Interactive 3D Arboretum grove. Drag to rotate and pinch to zoom.');renderer.domElement.setAttribute('role','img');document.body.prepend(renderer.domElement);document.getElementById('poster').hidden=true;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(46,1,.1,4000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.12;controls.minDistance=12;controls.maxDistance=1000;controls.maxPolarAngle=Math.PI*.59;controls.screenSpacePanning=true;
const uniforms={pixels:{value:1},glow:{value:0},time:{value:0}};
const vertexShader=`attribute float heightColor; varying vec3 color; uniform float pixels; uniform float glow; uniform float time;
vec3 palette(float t){vec3 a=vec3(.11,.17,.34),b=vec3(.22,.28,.65),c=vec3(.66,.20,.85),d=vec3(1.,.36,.48),e=vec3(1.,.72,.33),f=vec3(.55,1.,.90);float s=clamp(t,0.,1.)*5.;if(s<1.)return mix(a,b,s);if(s<2.)return mix(b,c,s-1.);if(s<3.)return mix(c,d,s-2.);if(s<4.)return mix(d,e,s-3.);return mix(e,f,s-4.);}
float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
void main(){
 float phase=mod(time,12.);float breath=phase<8.?pow(sin(phase*3.14159265359/8.),2.):0.;
 float canopy=smoothstep(.06,.25,heightColor);
 vec3 seed=vec3(hash(position),hash(position.yzx+19.),hash(position.zxy+47.));
 vec3 direction=normalize(vec3(seed.x-.5,.15+seed.y*.65,seed.z-.5));
 vec3 drift=direction*(3.+seed.y*10.)+vec3(sin(time*.65+seed.x*6.),0.,cos(time*.5+seed.z*6.))*1.5;
 vec3 p=position+drift*(breath*canopy);
 vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;color=palette(heightColor)*(1.+breath*canopy*.18);float core=clamp(pixels*.19/max(-mv.z,.1),1.2,6.);gl_PointSize=mix(core,core*3.,glow);
}`;
const fragmentShader=`varying vec3 color;uniform float glow;void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.)discard;float alpha=mix(1.,exp(-r*r*5.)*.22,glow);gl_FragColor=vec4(color,alpha);}`;
const core=new THREE.ShaderMaterial({uniforms,vertexShader,fragmentShader});scene.add(new THREE.Points(geometry,core));
const halo=new THREE.ShaderMaterial({uniforms:{pixels:uniforms.pixels,time:uniforms.time,glow:{value:1}},vertexShader,fragmentShader,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});scene.add(new THREE.Points(geometry,halo));
let frame=0,lastTime=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionButton=document.getElementById('motion');
function updateMotionLabel(){motionButton.textContent=playing?'Pause motion':'Play motion';motionButton.setAttribute('aria-pressed',String(!playing))}
function draw(now){frame=0;if(playing){if(lastTime)uniforms.time.value+=Math.min((now-lastTime)/1000,.05);lastTime=now}else lastTime=0;controls.update();renderer.render(scene,camera);if(playing)wake()}
function wake(){if(!frame&&!document.hidden)frame=requestAnimationFrame(draw)}controls.addEventListener('change',wake);
motionButton.onclick=()=>{playing=!playing;lastTime=0;updateMotionLabel();wake()};updateMotionLabel();
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();uniforms.pixels.value=renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));wake()}
function reset(){const target=new THREE.Vector3(0,14,0),distance=Math.max(210,72/(Math.tan(THREE.MathUtils.degToRad(23))*Math.min(camera.aspect,1)));camera.position.set(Math.sin(2.705)*distance,14+distance*.22,Math.cos(2.705)*distance);controls.target.copy(target);controls.update();wake()}
addEventListener('resize',resize);resize();reset();
document.getElementById('reset').onclick=reset;document.getElementById('zoomIn').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.8).add(controls.target);controls.update();wake()};document.getElementById('zoomOut').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.25).add(controls.target);controls.update();wake()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;lastTime=0}else wake()});renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='The 3D view paused. Reload this page to resume.'});
status.hidden=true;wake();
}catch(error){console.error(error);status.textContent='The 3D view could not load. You can still see the rendered grove.';const retry=document.createElement('a');retry.href=location.href;retry.textContent='Reload viewer';status.append(retry)}
</script></body></html>
