<img class="fallback" id="poster" src="preview.webp" alt="Luminous violet, amber, and cyan points revealing a grove at the Washington Park Arboretum.">
<header><a href="../lidar-studies.html#seattle">← LiDAR studies</a><h1>Arboretum / Luminous grove</h1><p id="sub">Seattle · laser returns</p></header>

<script type="module">
const status=document.getElementById('status');

const THREE=await import('three'),{OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const [meta,response]=await Promise.all([fetch('points.json').then(r=>{if(!r.ok)throw Error('Metadata unavailable');return r.json()}),fetch('points.bin')]);

const n=meta.count,packed=new Uint16Array(buffer,0,n*3),hb=new Uint8Array(buffer,n*6,n),ib=new Uint8Array(buffer,n*7,n),fb=new Uint8Array(buffer,n*8,n);

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(46,1,.1,20000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.12;controls.minDistance=meta.view.dist*.02;controls.maxDistance=meta.span[0]*3;controls.maxPolarAngle=Math.PI*.59;controls.screenSpacePanning=true;controls.autoRotateSpeed=.6;

// Height: the luminous palette. Sun: warm where the sun reaches, blue in shadow. Frost: glacier ramp, canopy whitened.
const vertexShader=`attribute float hgt,inten,flags,rnd; varying vec3 color; varying float hide;
uniform float pixels,glow,look,city,sizeMul,shape,keep,psize,time,breathe,unit,light,lphase,lmin,lspan;
float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
vec3 palette(float t){vec3 a=vec3(.11,.17,.34),b=vec3(.22,.28,.65),c=vec3(.66,.20,.85),d=vec3(1.,.36,.48),e=vec3(1.,.72,.33),f=vec3(.55,1.,.90);float s=clamp(t,0.,1.)*5.;if(s<1.)return mix(a,b,s);if(s<2.)return mix(b,c,s-1.);if(s<3.)return mix(c,d,s-2.);if(s<4.)return mix(d,e,s-3.);return mix(e,f,s-4.);}
vec3 glacier(float t){vec3 a=vec3(.075,.165,.388),b=vec3(.122,.31,.627),c=vec3(.184,.525,.761),d=vec3(.325,.761,.788),e=vec3(.651,.937,.847),f=vec3(.949,1.,.976);float s=clamp(t,0.,1.)*5.;if(s<1.)return mix(a,b,s);if(s<2.)return mix(b,c,s-1.);if(s<3.)return mix(c,d,s-2.);if(s<4.)return mix(d,e,s-3.);return mix(e,f,s-4.);}
void main(){
  float tree=mod(flags,2.),canopy=mod(floor(flags/2.),2.),lit=floor(flags/4.);
  hide=((tree<.5&&city<.5)||rnd>keep)?1.:0.;
  vec3 c;
  if(look<.5){c=palette(hgt);}
  else if(look<1.5){c=lit>.5?mix(vec3(1.,.70,.42),vec3(1.,.945,.84),hgt):vec3(.17,.25,.45)+.12*hgt;if(tree<.5)c*=.6;}
  else{c=glacier(pow(hgt,.65))*(.75+.45*inten);c=mix(c,vec3(.92,.98,1.),.55*canopy);if(tree<.5)c*=.45;c*=.45;}
  color=c;
  // breathing (Arboretum): the canopy drifts out and back on a 12 s cycle, the ground stays put
  vec3 p=position;
  if(breathe>.5){float phase=mod(time,12.);float breath=phase<8.?pow(sin(phase*3.14159265359/8.),2.):0.;
    float cano=smoothstep(.06,.25,hgt);vec3 seed=vec3(hash(position),hash(position.yzx+19.),hash(position.zxy+47.));

  // points light up as it passes and leave a fading trail, everything else drops near dark
  if(light>.5){float plane=lmin-lspan*.12+lspan*1.24*lphase;float d=position.x-plane;float w=lspan*.03;

  float core=clamp(pixels*psize*sizeMul*inversesqrt(max(keep,.1))*(shape>.5&&shape<1.5?1.7:1.)/max(-mv.z,.1),1.,8.*sizeMul+2.);

const fragmentShader=`varying vec3 color;varying float hide;uniform float glow,shape;void main(){if(hide>.5)discard;vec2 d=gl_PointCoord-.5;float r2=dot(d,d)*4.;float alpha=1.;
  if(glow>.5){if(r2>1.)discard;alpha=exp(-r2*5.)*.22;}else if(shape<.5){if(r2>1.)discard;}else if(shape<1.5){if(r2>1.)discard;alpha=exp(-r2*3.5);}

const core=new THREE.ShaderMaterial({uniforms:{...U,glow:{value:0}},vertexShader,fragmentShader});scene.add(new THREE.Points(geometry,core));
// a faint translucent sheet shows where the light is
const sheet=new THREE.Mesh(new THREE.PlaneGeometry(meta.span[2],meta.span[1]*1.1),new THREE.MeshBasicMaterial({color:0x64e7ed,transparent:true,opacity:.03,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));
sheet.rotation.y=Math.PI/2;sheet.position.set(0,meta.min[1]+meta.span[1]*.5,meta.min[2]+meta.span[2]*.5);sheet.visible=false;scene.add(sheet);
const halo=new THREE.ShaderMaterial({uniforms:{...U,glow:{value:1}},vertexShader,fragmentShader,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});const haloPts=new THREE.Points(geometry,halo);scene.add(haloPts);
const hp0=new URLSearchParams(location.hash.slice(1));
let frame=0,lastTime=0,playing=(hp0.has('alive')?hp0.get('alive')==='1':!!meta.breathe)&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
let lightOn=false,lightLast=0;
function draw(now){frame=0;if(playing){if(lastTime)U.time.value+=Math.min((now-lastTime)/1000,.05);lastTime=now}else lastTime=0;
  if(lightOn){if(lightLast)U.lphase.value=(U.lphase.value+Math.min((now-lightLast)/1000,.05)/12)%1;lightLast=now;sheet.position.x=U.lmin.value-U.lspan.value*.12+U.lspan.value*1.24*U.lphase.value}else lightLast=0;
  controls.update();renderer.render(scene,camera);if(controls.autoRotate||playing||lightOn)wake()}function wake(){if(!frame&&!document.hidden)frame=requestAnimationFrame(draw)}controls.addEventListener('change',wake);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();U.pixels.value=renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));wake()}
function reset(){const v=meta.view,target=new THREE.Vector3(0,v.targetY,0),distance=Math.max(v.dist,v.fit/(Math.tan(THREE.MathUtils.degToRad(23))*Math.min(camera.aspect,1)));camera.position.set(Math.sin(2.705)*distance,v.targetY+distance*v.elev,Math.cos(2.705)*distance);controls.target.copy(target);controls.update();wake()}
addEventListener('resize',resize);resize();reset();
document.getElementById('reset').onclick=reset;document.getElementById('zoomIn').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.8).add(controls.target);controls.update();wake()};document.getElementById('zoomOut').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.25).add(controls.target);controls.update();wake()};
// ---- looks, city and point controls; every setting lives in the URL (#look=sun&size=1.4&shape=soft&points=0.5&glow=0&spin=1&city=0)
const LOOKS=['height','sun','frost'],SHAPES=['dot','soft','square'];let glowOn=true;
const hp=new URLSearchParams(location.hash.slice(1));
const sync=()=>{const h=new URLSearchParams();if(U.look.value)h.set('look',LOOKS[U.look.value]);if(!U.city.value)h.set('city','0');if(U.sizeMul.value!==1)h.set('size',U.sizeMul.value);if(U.shape.value)h.set('shape',SHAPES[U.shape.value]);if(U.keep.value!==1)h.set('points',U.keep.value);if(!glowOn)h.set('glow','0');if(controls.autoRotate)h.set('spin','1');if(typeof playing!=='undefined'&&playing!==!!meta.breathe)h.set('alive',playing?'1':'0');if(typeof lightOn!=='undefined'&&lightOn)h.set('light','1');history.replaceState(null,'',h.toString()?'#'+h:location.pathname)};
function blend(){const frost=U.look.value===2,soft=U.shape.value===1;core.blending=frost?THREE.AdditiveBlending:THREE.NormalBlending;core.transparent=frost||soft;core.depthWrite=!(frost||soft);core.needsUpdate=true;haloPts.visible=glowOn&&!frost;wake()}

const setLook=k=>{U.look.value=k;on('[data-look]',b=>+b.dataset.look===k);blend();sync()};
const cityBtn=document.getElementById('city');const setCity=v=>{U.city.value=v?1:0;cityBtn.classList.toggle('on',v);cityBtn.setAttribute('aria-pressed',v);wake();sync()};
const sizeIn=document.getElementById('size');const setSize=v=>{U.sizeMul.value=+(+v).toFixed(2);sizeIn.value=v;wake();sync()};
const setShape=k=>{U.shape.value=k;on('[data-shape]',b=>+b.dataset.shape===k);blend();sync()};
const setKeep=v=>{U.keep.value=v;on('[data-keep]',b=>+b.dataset.keep===v);wake();sync()};
const glowBtn=document.getElementById('glowBtn');const setGlow=v=>{glowOn=v;glowBtn.classList.toggle('on',v);blend();sync()};
const spinBtn=document.getElementById('spin');const setSpin=v=>{controls.autoRotate=v;spinBtn.classList.toggle('on',v);wake();sync()};
document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>setLook(+b.dataset.look));cityBtn.onclick=()=>setCity(!U.city.value);
sizeIn.oninput=()=>setSize(sizeIn.value);document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>setShape(+b.dataset.shape));
document.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>setKeep(+b.dataset.keep));glowBtn.onclick=()=>setGlow(!glowOn);spinBtn.onclick=()=>setSpin(!controls.autoRotate);
const panel=document.getElementById('panel'),ptsBtn=document.getElementById('ptsBtn');ptsBtn.onclick=()=>{panel.hidden=!panel.hidden;ptsBtn.classList.toggle('on',!panel.hidden);ptsBtn.setAttribute('aria-expanded',!panel.hidden)};
setCity(hp.get('city')!=='0');setSize(Math.min(3,Math.max(.3,+(hp.get('size')||1))));setShape(Math.max(0,SHAPES.indexOf(hp.get('shape')||'dot')));setKeep([1,.5,.25].includes(+hp.get('points'))?+hp.get('points'):1);setGlow(hp.get('glow')!=='0');setSpin(hp.get('spin')==='1');setLook(Math.max(0,LOOKS.indexOf(hp.get('look')||'height')));
const motionButton=document.getElementById('motion');
// Alive: the canopy breathes (expands and returns on a 12 s cycle); off, everything holds still
function updateMotionLabel(){motionButton.classList.toggle('on',playing);motionButton.setAttribute('aria-pressed',String(playing));document.getElementById('breatheNote').hidden=!playing}
const lightBtn=document.getElementById('lightBtn');
const setLight=v=>{lightOn=v;U.light.value=v?1:0;sheet.visible=v;lightBtn.classList.toggle('on',v);lightBtn.setAttribute('aria-pressed',String(v));lightLast=0;sync();wake()};
lightBtn.onclick=()=>setLight(!lightOn);setLight(hp0.get('light')==='1');
motionButton.onclick=()=>{playing=!playing;lastTime=0;if(!playing)U.time.value=0;updateMotionLabel();sync();wake()};updateMotionLabel();
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;lastTime=0}else wake()});renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();status.hidden=false;status.textContent='The 3D view paused. Reload this page to resume.'});

}catch(error){console.error(error);status.textContent='The 3D view could not load. You can still see the rendered grove.';const retry=document.createElement('a');retry.href=location.href;retry.textContent='Reload viewer';status.append(retry)}
