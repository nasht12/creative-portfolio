<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seattle LiDAR Viewer</title>
<style>
html,body{margin:0;height:100%;background:#05070c;color:#d9d6cc;font:12px/1.6 Consolas,ui-monospace,monospace;overflow:hidden}
canvas{display:block}#hud{position:fixed;left:18px;bottom:16px;max-width:420px;opacity:.88;pointer-events:none}
#hud b{color:#fff;font-weight:600}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<a href="../lidar-studies.html#seattle" style="position:fixed;top:16px;left:18px;z-index:2;color:#d9d6cc;font:12px Consolas,monospace;text-decoration:none">&larr; LiDAR studies</a><div id="hud"><b>Seattle, 2,492,562 LiDAR points</b><br>King County West 2021 &middot; colored by height above ground &middot; water removed<br>
drag to orbit &middot; right-drag to pan &middot; scroll to zoom<br><span id="status">loading&hellip;</span></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
THREE.ColorManagement.enabled = false;
const status = document.getElementById('status');
const meta = await (await fetch('points.json')).json();
const buf = await (await fetch('points.bin')).arrayBuffer();
const n = meta.count;
const q = new Uint16Array(buf, 0, n * 3);
const col = new Uint8Array(buf, n * 6, n * 3);
const kind = new Uint8Array(buf, n * 9, n);
const [sx, sy, sz] = meta.scale, [ox, oy, oz] = meta.offset;
const pos = new Float32Array(n * 3), size = new Float32Array(n);
for (let i = 0; i < n; i++) {  // data: x east, y north, z up -> three.js: y up, -z north
  pos[3 * i] = q[3 * i] * sx + ox;
  pos[3 * i + 1] = q[3 * i + 2] * sz + oz;
  pos[3 * i + 2] = -(q[3 * i + 1] * sy + oy);
  size[i] = meta.sizes[kind[i]];
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('acol', new THREE.BufferAttribute(col, 3, true));
geo.setAttribute('asize', new THREE.BufferAttribute(size, 1));
const bg = new THREE.Color(0x05070c);
const mat = new THREE.ShaderMaterial({
  uniforms: {scale: {value: 1}, minPx: {value: 1.2}, fogColor: {value: bg}, fogNear: {value: 16000}, fogFar: {value: 48000}},
  vertexShader: `
    attribute vec3 acol; attribute float asize;
    uniform float light, lphase, lmin, lspan;
    uniform float scale, minPx; varying vec3 vCol; varying float vDepth;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      vDepth = -mv.z;
      gl_PointSize = clamp(asize * scale / vDepth, minPx, 48.0);
      vCol = acol;
      // passing light: a plane sweeps east-west every 12 s; points flare as it passes, the rest stays at 45%
      if (light > 0.5) { float plane = lmin - lspan * 0.12 + lspan * 1.24 * lphase; float d = position.x - plane;
        float w = lspan * 0.03; float band = exp(-d * d / (w * w)); float trail = d < 0.0 ? exp(d / (lspan * 0.15)) : 0.0;
        vCol = mix(vCol, vec3(0.48, 1.0, 1.0), band * 0.42) * (0.45 + band * 1.0 + trail * 0.3); }
    }`,
  fragmentShader: `
    uniform vec3 fogColor; uniform float fogNear, fogFar; varying vec3 vCol; varying float vDepth;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      if (dot(p, p) > 0.25) discard;
      gl_FragColor = vec4(mix(vCol, fogColor, smoothstep(fogNear, fogFar, vDepth)), 1.0);
    }`,
});
const scene = new THREE.Scene();
scene.background = bg;
scene.add(new THREE.Points(geo, mat));
const renderer = new THREE.WebGLRenderer({antialias: false});
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, 1, 10, 90000);
// a view can be passed in the URL: #cam=x,y,z&target=x,y,z (also stops the auto-rotate)
const hp = new URLSearchParams(location.hash.slice(1));
const vec = k => hp.get(k) && hp.get(k).split(',').map(Number);
if (hp.has('clean')) document.querySelectorAll('#hud, body > a').forEach(e => e.style.display = 'none');  // for stills
camera.position.set(...(vec('cam') || meta.camera));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...(vec('target') || meta.target));
controls.enableDamping = true;
controls.autoRotate = !vec('cam');
controls.autoRotateSpeed = 0.3;
controls.maxPolarAngle = Math.PI * 0.49;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  // pixels per foot at distance 1: drawing-buffer height over the vertical view span
  mat.uniforms.scale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', resize);
resize();
status.textContent = 'ready';
window.__viewer = {n, ready: true, camera, controls, renderer, scene, mat};
// ---- Light: a sheet of light sweeps east-west through the scan (#light=1)
{
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < pos.length; i += 3) { const x = pos[i]; if (x < lo) lo = x; if (x > hi) hi = x; }
  Object.assign(mat.uniforms, {light: {value: 0}, lphase: {value: 0.5}, lmin: {value: lo}, lspan: {value: hi - lo}});
  mat.needsUpdate = true;
  const btn = document.createElement('button');
  btn.id = 'lightbtn'; btn.textContent = 'Light';
  btn.style.cssText = 'position:fixed;top:12px;z-index:2;font:12px Consolas,monospace;color:#d9d6cc;background:#ffffff14;border:1px solid #ffffff30;border-radius:16px;padding:7px 13px;cursor:pointer';
  btn.style.right = document.getElementById('style') ? '128px' : '14px';
  document.body.appendChild(btn);
  if (hp.has('clean')) btn.style.display = 'none';
  let on = false, last = 0;
  const set = v => {
    on = v; mat.uniforms.light.value = v ? 1 : 0;
    btn.style.background = v ? '#d9d6cc' : '#ffffff14'; btn.style.color = v ? '#05070c' : '#d9d6cc';
    const h = new URLSearchParams(location.hash.slice(1)); v ? h.set('light', '1') : h.delete('light');
    history.replaceState(null, '', h.toString() ? '#' + h.toString().replace(/=(&|$)/g, '$1') : location.pathname + location.search);
  };
  btn.addEventListener('click', () => set(!on));
  set(hp.get('light') === '1');
  window.__light = now => { const dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
    if (on) mat.uniforms.lphase.value = (mat.uniforms.lphase.value + dt / 12) % 1; };
}
renderer.setAnimationLoop(now => { window.__light(now); controls.update(); renderer.render(scene, camera); });
</script></body></html>
