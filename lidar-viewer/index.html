<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seattle LiDAR Viewer</title>
<style>
html,body{margin:0;height:100%;background:#05070c;color:#d9d6cc;font:12px/1.6 Consolas,ui-monospace,monospace;overflow:hidden}
canvas{display:block}#hud{position:fixed;left:18px;bottom:16px;max-width:420px;opacity:.88;pointer-events:none}
#hud b{color:#fff;font-weight:600}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="../viewer-ui/viewer-ui.css">
<style>#hud,body>a,#style,#lightbtn{display:none!important}canvas{touch-action:none}</style>
</head><body>
<div id="hud"><b>Seattle, 3,080,230 LiDAR points</b><br>King County West 2021 &middot; colored by height above ground &middot; water removed<br>
drag to orbit &middot; right-drag to pan &middot; scroll to zoom<br><span id="status">loading&hellip;</span></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
THREE.ColorManagement.enabled = false;
const status = document.getElementById('status');
const meta = await (await fetch('points.json')).json();
const buf = await (await fetch('points.bin')).arrayBuffer();
const n = meta.count;
const q = new Uint16Array(buf, 0, n * 3);
const col = new Uint8Array(buf, n * 6, n * 3);
const kind = new Uint8Array(buf, n * 9, n);
const [sx, sy, sz] = meta.scale, [ox, oy, oz] = meta.offset;
const pos = new Float32Array(n * 3), size = new Float32Array(n);
for (let i = 0; i < n; i++) {  // data: x east, y north, z up -> three.js: y up, -z north
  pos[3 * i] = q[3 * i] * sx + ox;
  pos[3 * i + 1] = q[3 * i + 2] * sz + oz;
  pos[3 * i + 2] = -(q[3 * i + 1] * sy + oy);
  size[i] = meta.sizes[kind[i]];
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('acol', new THREE.BufferAttribute(col, 3, true));
geo.setAttribute('asize', new THREE.BufferAttribute(size, 1));
geo.setAttribute('hid', new THREE.BufferAttribute(meta.hotspots ? new Uint8Array(buf, n * 10, n) : new Uint8Array(n), 1));
const bg = new THREE.Color(0x05070c);
const mat = new THREE.ShaderMaterial({
  uniforms: {uHover: {value: 0}, scale: {value: 1}, minPx: {value: 1.2}, fogColor: {value: bg}, fogNear: {value: 16000}, fogFar: {value: 48000}},
  vertexShader: `
    attribute vec3 acol; attribute float asize; attribute float hid; uniform float uHover;
    uniform float light, lphase, lmin, lspan, uSize, uShape, uKeep;
    attribute float rnd;
    uniform float scale, minPx; varying vec3 vCol; varying float vDepth;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      vDepth = -mv.z;
      gl_PointSize = clamp(asize * uSize * inversesqrt(max(uKeep, 0.1)) * (uShape > 0.5 && uShape < 1.5 ? 1.7 : 1.0) * scale / vDepth, minPx, 48.0);
      vCol = acol;
      if (uHover > 0.5) {   // a hotspot is hovered: it brightens, everything else steps back
        if (abs(hid - uHover) < 0.5) { vCol = min(vCol * 1.45 + vec3(0.30, 0.22, 0.08), vec3(1.0)); gl_PointSize *= 1.3; }
        else vCol *= 0.5;
      }
      // passing light: a band sweeps east-west every 12 s; points flare as it passes, the rest stays at 45%
      if (light > 0.5) { float plane = lmin - lspan * 0.12 + lspan * 1.24 * lphase; float d = position.x - plane;
        float w = lspan * 0.03; float band = exp(-d * d / (w * w)); float trail = d < 0.0 ? exp(d / (lspan * 0.15)) : 0.0;
        vCol = mix(vCol, vec3(0.48, 1.0, 1.0), band * 0.42) * (0.45 + band * 1.0 + trail * 0.3); }
      if (rnd > uKeep) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);   // Density: thinned points go off screen
    }`,
  fragmentShader: `
    uniform float uShape; uniform vec3 fogColor; uniform float fogNear, fogFar; varying vec3 vCol; varying float vDepth;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float a = 1.0; if (uShape < 1.5) { if (dot(p, p) > 0.25) discard; if (uShape > 0.5) a = exp(-dot(p, p) * 14.0); }
      gl_FragColor = vec4(mix(vCol, fogColor, smoothstep(fogNear, fogFar, vDepth)), a);
    }`,
});
const scene = new THREE.Scene();
scene.background = bg;
scene.add(new THREE.Points(geo, mat));
const renderer = new THREE.WebGLRenderer({antialias: false});
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, 1, 10, 90000);
// a view can be passed in the URL: #cam=x,y,z&target=x,y,z (also stops the auto-rotate)
const hp = new URLSearchParams(location.hash.slice(1));
const vec = k => hp.get(k) && hp.get(k).split(',').map(Number);
if (hp.has('clean')) document.querySelectorAll('#hud, body > a').forEach(e => e.style.display = 'none');  // for stills
camera.position.set(...(vec('cam') || meta.camera));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...(vec('target') || meta.target));
controls.enableDamping = true;
controls.autoRotate = !vec('cam');
controls.autoRotateSpeed = 0.3;
controls.maxPolarAngle = Math.PI * 0.49;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  // pixels per foot at distance 1: drawing-buffer height over the vertical view span
  mat.uniforms.scale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', resize);
resize();
// ---- hotspots: subjects with their own viewer. A dot marks each; hover lights it up, click opens it
// (touch: the first tap shows it, a second tap opens it)
const spots = (meta.hotspots || []).map(h => ({...h, box: new THREE.Box3(new THREE.Vector3(...h.min), new THREE.Vector3(...h.max)),
  top: new THREE.Vector3((h.min[0] + h.max[0]) / 2, h.max[1], (h.min[2] + h.max[2]) / 2)}));
const css = document.createElement('style');
css.textContent = `.spot-pin{position:fixed;z-index:1;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:#ffd48a;box-shadow:0 0 0 3px #ffd48a33,0 0 10px #ffb44f;cursor:pointer;transition:transform .15s}
.spot-pin.on{transform:scale(1.5)}.spot-pin[hidden]{display:none}
#spot-tip{position:fixed;z-index:2;transform:translate(-50%,calc(-100% - 14px));background:#0e1424f2;border:1px solid #ffd48a66;border-radius:12px;padding:6px 11px;font:13px/1.35 system-ui,sans-serif;white-space:nowrap;pointer-events:auto}
#spot-tip a{color:#ece9e2;text-decoration:none}
#spot-fade{position:fixed;inset:0;z-index:6;background:#05070c;opacity:0;pointer-events:none;transition:opacity .45s}
.spot-flying .spot-pin,.spot-flying .vui-bar{opacity:0;pointer-events:none}
#spot-tip small{display:block;color:#e6b77a;font-size:11px}#spot-tip[hidden]{display:none}
.vui-clean .spot-pin,.vui-clean #spot-tip{display:none!important}`;
document.head.appendChild(css);
// (a div holding the link: the page hides links placed straight in <body>, its old back link)
const tip = Object.assign(document.createElement('div'), {id: 'spot-tip', hidden: true}), tipA = document.createElement('a');
tip.appendChild(tipA);
document.body.appendChild(tip);
const v3 = new THREE.Vector3();
spots.forEach(s => {
  s.pin = Object.assign(document.createElement('div'), {className: 'spot-pin', title: s.label});
  s.pin.addEventListener('pointerenter', () => setHover(s));
  s.pin.addEventListener('pointerleave', () => setHover(null));
  s.pin.addEventListener('click', () => go(s));
  document.body.appendChild(s.pin);
});
let hover = null;
function placeTip() {
  if (!hover) return;
  v3.copy(hover.top).project(camera);
  tip.style.left = (v3.x + 1) / 2 * innerWidth + 'px';
  tip.style.top = (1 - v3.y) / 2 * innerHeight + 'px';
}
function placePins() {
  for (const s of spots) {
    v3.copy(s.top).project(camera);
    const off = v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05;
    s.pin.hidden = off;
    if (!off) { s.pin.style.left = (v3.x + 1) / 2 * innerWidth + 'px'; s.pin.style.top = (1 - v3.y) / 2 * innerHeight + 'px'; }
  }
  placeTip();
}
function setHover(s) {
  if (s === hover) return;
  if (hover) hover.pin.classList.remove('on');
  hover = s;
  mat.uniforms.uHover.value = s ? s.id : 0;
  renderer.domElement.style.cursor = s ? 'pointer' : '';
  tip.hidden = !s;
  if (s && !flying) { s.pin.classList.add('on'); tipA.href = s.url; tipA.innerHTML = s.label + '<small>Open its 3D view \u2197</small>'; placeTip(); }
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
function pick(e) {   // the nearest hotspot box under the pointer
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  let best = null, bd = Infinity;
  for (const s of spots) if (ray.ray.intersectBox(s.box, hit)) { const d = hit.distanceTo(camera.position); if (d < bd) { bd = d; best = s; } }
  return best;
}
const cv = renderer.domElement;
let down = null;
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons) setHover(pick(e)); });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setHover(null); });
cv.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const s = pick(e);
  if (s && (e.pointerType === 'mouse' || s === hover)) go(s);
  else setHover(s);
});
tipA.addEventListener('click', e => { if (hover) { e.preventDefault(); go(hover); } });

// ---- opening a hotspot: the camera eases in to the exact angle that viewer opens at while its
// data loads in the background, the screen fades, and the page changes. Back again, it flies out.
const fade = Object.assign(document.createElement('div'), {id: 'spot-fade'});
document.body.appendChild(fade);
const D2R = Math.PI / 180, TAN = Math.tan(camera.fov / 2 * D2R);
function viewOf(s) {
  const c = s.box.getCenter(new THREE.Vector3()), d = s.box.getSize(new THREE.Vector3());
  if (s.view) {   // canopy viewer: 46 deg lens, a fixed bearing, height = distance x elev
    const v = s.view, f = Math.tan(23 * D2R), dist = Math.max(v.dist, v.fit / (f * Math.min(camera.aspect, 1))) * f / TAN;
    const t = new THREE.Vector3(c.x, s.box.min.y + v.targetY, c.z);
    return {t, p: new THREE.Vector3(t.x + Math.sin(2.705) * dist, t.y + dist * v.elev, t.z + Math.cos(2.705) * dist)};
  }
  // landmark viewer: 42 deg lens, from 210 deg (south-southwest) and 18 deg up, 2.4 x the subject
  const ext = Math.max(d.x, d.y, d.z), dist = ext * 2.4 * Math.tan(21 * D2R) / TAN, az = 210 * D2R, el = 18 * D2R;
  return {t: c, p: new THREE.Vector3(c.x + dist * Math.sin(az) * Math.cos(el), c.y + dist * Math.sin(el), c.z - dist * Math.cos(az) * Math.cos(el))};
}
let flying = false;
function fly(a, b, ms) {   // orbit-style path: target slides, bearing turns, distance shrinks evenly in log
  return new Promise(done => {
    flying = true; controls.enabled = false; controls.autoRotate = false;
    const s0 = new THREE.Spherical().setFromVector3(a.p.clone().sub(a.t)), s1 = new THREE.Spherical().setFromVector3(b.p.clone().sub(b.t));
    let dth = s1.theta - s0.theta; dth -= Math.round(dth / (2 * Math.PI)) * 2 * Math.PI;
    const sp = new THREE.Spherical(), t0 = performance.now();
    (function step(now) {
      const k = Math.min((now - t0) / ms, 1), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      controls.target.lerpVectors(a.t, b.t, e);
      sp.set(Math.exp(Math.log(s0.radius) * (1 - e) + Math.log(s1.radius) * e), s0.phi + (s1.phi - s0.phi) * e, s0.theta + dth * e);
      camera.position.setFromSpherical(sp).add(controls.target);
      camera.lookAt(controls.target);
      placeTip();
      if (k < 1) requestAnimationFrame(step);
      else { flying = false; controls.enabled = true; controls.update(); placePins(); done(); }
    })(t0);
  });
}
const store = (k, v) => { try { v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const recall = k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } };
async function go(s) {
  if (flying) return;
  setHover(s);
  tipA.innerHTML = s.label + '<small>Opening its 3D view\u2026</small>';
  document.body.classList.add('spot-flying');
  store('lidarCity', {id: s.id, cam: camera.position.toArray(), target: controls.target.toArray()});
  const base = new URL(s.url, location.href);   // warm the cache, so the next page opens at once
  const load = Promise.all(['', 'points.json', 'points.bin'].map(f => fetch(new URL(f, base)).then(r => r.arrayBuffer()).catch(() => null)));
  await fly({p: camera.position.clone(), t: controls.target.clone()}, viewOf(s), 2400);
  await Promise.race([load, new Promise(r => setTimeout(r, 8000))]);
  fade.style.opacity = 1;
  await new Promise(r => setTimeout(r, 450));
  location.href = s.url;
}
function comeBack(any) {   // returning from a hotspot's viewer: start at its angle and fly back out
  const st = recall('lidarCity'), s = st && spots.find(x => x.id === st.id);
  store('lidarCity');
  document.body.classList.remove('spot-flying');
  let ref = '', nav = ''; try { ref = document.referrer; nav = performance.getEntriesByType('navigation')[0].type; } catch (e) {}
  // a fresh load from that viewer's back link, or a history step back (where the referrer is stale)
  if (!s || !(any || nav === 'back_forward' || ref.includes(new URL(s.url, location.href).pathname))) { fade.style.opacity = 0; return; }
  const v = viewOf(s);
  camera.position.copy(v.p); controls.target.copy(v.t);
  fade.style.transition = 'none'; fade.style.opacity = 1; fade.offsetWidth; fade.style.transition = ''; fade.style.opacity = 0;
  setHover(s);
  fly(v, {p: new THREE.Vector3(...st.cam), t: new THREE.Vector3(...st.target)}, 2000).then(() => setHover(null));
}
addEventListener('pageshow', e => { if (e.persisted) comeBack(true); });   // the browser's back button
{ const t0 = performance.now();   // after the shared controls mount (they set the spin and the view)
  (function wait() { if (document.querySelector('.vui-bar') || performance.now() - t0 > 4000) comeBack(false); else requestAnimationFrame(wait); })(); }
controls.addEventListener('change', placePins);
addEventListener('resize', placePins);
placePins();
status.textContent = 'ready';
window.__viewer = {n, ready: true, camera, controls, renderer, scene, mat};
// ---- shared viewer UI: same layout, words and URL keys as every LiDAR viewer
{
  const rnd = new Float32Array(n);
  for (let i = 0, s = 7; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; rnd[i] = s / 0x7fffffff; }
  geo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 1));
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < pos.length; i += 3) { const x = pos[i]; if (x < lo) lo = x; if (x > hi) hi = x; }
  Object.assign(mat.uniforms, {light: {value: 0}, lphase: {value: 0.5}, lmin: {value: lo}, lspan: {value: hi - lo},
                               uSize: {value: 1}, uShape: {value: 0}, uKeep: {value: 1}});
  mat.needsUpdate = true;
  window.__lightOn = false;
  const {mountViewerUI} = await import('../viewer-ui/viewer-ui.js');
  mountViewerUI({
    back: {href: '../lidar-studies.html#seattle'}, title: 'Seattle / City point cloud', subtitle: `Seattle · ${n.toLocaleString()} laser returns · water removed`, notes: ['King County West 2021 LiDAR · colored by height above ground', 'Glowing dots mark places with their own 3D view: hover to light one up, click to open it'],
    onSize: v => { mat.uniforms.uSize.value = v; },
    onShape: i => { mat.uniforms.uShape.value = i; const soft = i === 1; mat.transparent = soft; mat.depthWrite = !soft; mat.needsUpdate = true; },
    onDensity: v => { mat.uniforms.uKeep.value = v; },
    onLight: v => { window.__lightOn = v; mat.uniforms.light.value = v ? 1 : 0; },
    effects: {spin: {default: controls.autoRotate}}, camera, controls,
    reset: () => { camera.position.set(...meta.camera); controls.target.set(...meta.target); controls.update(); },
  });
}
let lastT = 0;
renderer.setAnimationLoop(now => {
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0; lastT = now;
  if (window.__lightOn) mat.uniforms.lphase.value = (mat.uniforms.lphase.value + dt / 12) % 1;
  controls.update(); renderer.render(scene, camera);
});
</script></body></html>
