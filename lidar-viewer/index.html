  Object.assign(mat.uniforms, {light: {value: 0}, lphase: {value: 0.5}, lmin: {value: lo}, lspan: {value: hi - lo},
                               uSize: {value: 1}, uShape: {value: 0}, uKeep: {value: 1}});
  mat.needsUpdate = true;
  window.__lightOn = false;
  const {mountViewerUI} = await import('../viewer-ui/viewer-ui.js');
  mountViewerUI({
    back: {href: '../lidar-studies.html#seattle'}, title: 'Seattle / City point cloud', subtitle: `Seattle · ${n.toLocaleString()} laser returns · water removed`, notes: ['King County West 2021 LiDAR · colored by height above ground', 'Glowing dots mark places with their own 3D view: hover to light one up, click to open it', 'True colour: USDA NAIP aerial photo, Oct 2023 (towers lean in the photo)'],
  colors: [{key: 'height', label: 'Height'}, {key: 'photo', label: 'True colour'}], color: 'height', onColor: k => window.__setColor(k),
    onSize: v => { mat.uniforms.uSize.value = v; },
    onShape: i => { mat.uniforms.uShape.value = i; const soft = i === 1; mat.transparent = soft; mat.depthWrite = !soft; mat.needsUpdate = true; },
    onDensity: v => { mat.uniforms.uKeep.value = v; },
    onLight: v => { window.__lightOn = v; mat.uniforms.light.value = v ? 1 : 0; },
    effects: {spin: {default: controls.autoRotate}}, camera, controls,
    reset: () => { camera.position.set(...meta.camera); controls.target.set(...meta.target); controls.update(); },
  });
}
let lastT = 0;
renderer.setAnimationLoop(now => {
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0; lastT = now;
  if (window.__lightOn) mat.uniforms.lphase.value = (mat.uniforms.lphase.value + dt / 12) % 1;
  controls.update(); renderer.render(scene, camera);
});
