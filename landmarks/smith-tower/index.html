<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smith Tower in LiDAR</title>
<style>
html,body{margin:0;height:100%;background:#06080e;color:#d9d6cc;font:12px/1.6 Consolas,ui-monospace,monospace;overflow:hidden}
canvas{display:block}
#hud{position:fixed;left:18px;bottom:16px;max-width:430px;opacity:.9;pointer-events:none;text-shadow:0 1px 2px #000}
#hud b{font-size:14px;letter-spacing:.06em;color:#f1eee4}
#ui{position:fixed;top:12px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#ui button{font:12px Consolas,monospace;color:#d9d6cc;background:#ffffff12;border:1px solid #ffffff30;border-radius:16px;padding:7px 13px;cursor:pointer}
#ui button:hover{background:#ffffff26}#ui button.on{background:#d9d6cc;color:#06080e;border-color:#d9d6cc}
#back{position:fixed;top:16px;left:18px;color:#d9d6cc;text-decoration:none;opacity:.85}
#pts{position:fixed;right:14px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#pts>button,#panel button{font:12px Consolas,monospace;color:#d9d6cc;background:#ffffff12;border:1px solid #ffffff30;border-radius:16px;padding:6px 12px;cursor:pointer}
#pts button:hover{background:#ffffff26}#pts button.on{background:#d9d6cc;color:#06080e;border-color:#d9d6cc}
#panel{background:#0b0f1ae6;border:1px solid #ffffff22;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto auto;gap:9px 12px;align-items:center}
#panel[hidden]{display:none}#panel label{opacity:.7}#panel .row{display:flex;gap:5px;flex-wrap:wrap}
#panel input[type=range]{width:150px;accent-color:#d9d6cc}
.clean #hud,.clean #ui,.clean #back,.clean #pts{display:none}
@media(max-width:600px){#ui{top:44px;left:14px;right:14px;justify-content:flex-start}#hud{right:18px;bottom:64px}#pts{left:14px;align-items:flex-start}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<a id="back" href="../../lidar-studies.html#landmarks">&larr; LiDAR studies</a>
<div id="ui"><button data-look="sun">Sun</button><button data-look="frost">Frost</button><button data-look="height">Height</button><button id="city">City</button><button id="lightBtn">Light</button></div>
<div id="pts"><div id="panel" hidden>
<label for="size">Size</label><input id="size" type="range" min="0.3" max="3" step="0.05" value="1">
<label>Shape</label><div class="row"><button data-shape="0">Dot</button><button data-shape="1">Soft</button><button data-shape="2">Square</button></div>
<label>Points</label><div class="row"><button data-keep="1">All</button><button data-keep="0.5">Half</button><button data-keep="0.25">Quarter</button></div>
<label>Motion</label><div class="row"><button id="spin">Spin</button></div>
</div><button id="ptsbtn">Points &#9662;</button></div>
<div id="hud"><b>Smith Tower</b><br>38,363 points on the landmark &middot; 459 ft tall &middot; King County West 2021 LiDAR<br>
drag to orbit &middot; right-drag to pan &middot; scroll to zoom<br><span id="status">loading&hellip;</span></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
THREE.ColorManagement.enabled = false;
const status = document.getElementById('status');
const meta = await (await fetch('points.json')).json();
const buf = await (await fetch('points.bin')).arrayBuffer();
const n = meta.count;
const q = new Uint16Array(buf, 0, n * 3);
const cols = [0, 1, 2].map(k => new Uint8Array(buf, n * (6 + 3 * k), n * 3));
const sub = new Uint8Array(buf, n * 15, n);
const [sx, sy, sz] = meta.scale, [ox, oy, oz] = meta.offset;
const pos = new Float32Array(n * 3), flag = new Float32Array(n);
for (let i = 0; i < n; i++) {  // data: x east, y north, z up -> three.js: y up, -z north
  pos[3 * i] = q[3 * i] * sx + ox;
  pos[3 * i + 1] = q[3 * i + 2] * sz + oz;
  pos[3 * i + 2] = -(q[3 * i + 1] * sy + oy);
  flag[i] = sub[i];
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
['c0', 'c1', 'c2'].forEach((a, k) => geo.setAttribute(a, new THREE.BufferAttribute(cols[k], 3, true)));
geo.setAttribute('sub', new THREE.BufferAttribute(flag, 1));
const rnd = new Float32Array(n);
for (let i = 0, s = 7; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; rnd[i] = s / 0x7fffffff; }
geo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 1));
const mat = new THREE.ShaderMaterial({
  uniforms: {look: {value: 0}, scale: {value: 1}, size: {value: meta.size}, city: {value: 1},
             sizeMul: {value: 1}, shape: {value: 0}, keep: {value: 1},
             light: {value: 0}, lphase: {value: 0.5}, lmin: {value: -0.05 * (meta.height || 300)}, lspan: {value: 1.1 * (meta.height || 300)}},
  vertexShader: `
    attribute vec3 c0, c1, c2; attribute float sub, rnd;
    uniform float look, scale, size, city, sizeMul, shape, keep, light, lphase, lmin, lspan;
    varying vec3 vCol; varying float vHide;
    void main() {
      vHide = ((sub < 0.5 && city < 0.5) || rnd > keep) ? 1.0 : 0.0;
      vec3 c = look < 0.5 ? c0 : (look < 1.5 ? c1 : c2);
      float frost = look > 0.5 && look < 1.5 ? 1.0 : 0.0;
      if (sub < 0.5) c = c * mix(0.32, 0.22, frost) + vec3(0.03, 0.045, 0.08) * (1.0 - frost);
      vec3 color = c * mix(1.0, mix(0.35, 0.8, sub), frost);
  // passing light (from the forest-effects-lab study): a thin plane sweeps the scene every 12 s;
  // points light up as it passes and leave a fading trail; the rest stays visible at 45%
  if(light>.5){float plane=lmin-lspan*.12+lspan*1.24*lphase;float d=position.y-plane;float w=lspan*.03;
    float band=exp(-d*d/(w*w));float trail=d<0.?exp(d/(lspan*.15)):0.;
    color=mix(color,vec3(.48,1.,1.),band*.42)*(.45+band*1.0+trail*.3);}
      vCol = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      // thinner clouds get slightly bigger points so they don't vanish; soft dots need room to fade
      float s = size * sizeMul * mix(1.0, 0.7, frost) * mix(0.8, 1.0, sub) * inversesqrt(max(keep, 0.1))
              * (shape > 0.5 && shape < 1.5 ? 1.7 : 1.0);
      gl_PointSize = clamp(s * scale / -mv.z, 1.0, 48.0);
    }`,
  fragmentShader: `
    uniform float shape;
    varying vec3 vCol; varying float vHide;
    void main() {
      if (vHide > 0.5) discard;
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d) * 4.0;          // 0 at the centre, 1 at the edge
      float a = 1.0;
      if (shape < 0.5) { if (r2 > 1.0) discard; }
      else if (shape < 1.5) { if (r2 > 1.0) discard; a = exp(-r2 * 3.5); }
      gl_FragColor = vec4(vCol, a);
    }`,
});
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080e);
scene.add(new THREE.Points(geo, mat));
const camera = new THREE.PerspectiveCamera(42, 1, 1, 20000);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.maxDistance = meta.maxDistance;
camera.position.fromArray(meta.camera);
controls.target.fromArray(meta.target);
const resize = () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  mat.uniforms.scale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
};
addEventListener('resize', resize);
resize();
const LOOKS = ['sun', 'frost', 'height'], SHAPES = ['dot', 'soft', 'square'];
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.has('clean')) document.body.classList.add('clean');
const sync = () => {
  const h = new URLSearchParams(location.hash.slice(1));
  h.set('look', LOOKS[mat.uniforms.look.value]);
  if (mat.uniforms.city.value) h.delete('city'); else h.set('city', '0');
  const u = mat.uniforms;
  u.sizeMul.value === 1 ? h.delete('size') : h.set('size', u.sizeMul.value);
  u.shape.value === 0 ? h.delete('shape') : h.set('shape', SHAPES[u.shape.value]);
  u.keep.value === 1 ? h.delete('points') : h.set('points', u.keep.value);
  controls.autoRotate ? h.delete('spin') : h.set('spin', '0');
  typeof lightOn !== 'undefined' && lightOn ? h.set('light', '1') : h.delete('light');
  history.replaceState(null, '', '#' + h.toString().replace(/=(&|$)/g, '$1'));
};
const setLook = name => {
  const k = Math.max(0, LOOKS.indexOf(name));
  mat.uniforms.look.value = k;
  blend();
  document.querySelectorAll('[data-look]').forEach(b => b.classList.toggle('on', b.dataset.look === LOOKS[k]));
  sync();
};
function blend() {
  const frost = mat.uniforms.look.value === 1, soft = mat.uniforms.shape.value === 1;
  // frost adds light where points pile up; soft dots fade at the edge, so both blend
  mat.blending = frost ? THREE.AdditiveBlending : THREE.NormalBlending;
  mat.depthWrite = !(frost || soft);
  mat.transparent = frost || soft;
  mat.needsUpdate = true;
}
const panel = document.getElementById('panel'), ptsBtn = document.getElementById('ptsbtn');
ptsBtn.addEventListener('click', () => { panel.hidden = !panel.hidden; ptsBtn.classList.toggle('on', !panel.hidden); });
const sizeIn = document.getElementById('size');
const setSize = v => { mat.uniforms.sizeMul.value = +(+v).toFixed(2); sizeIn.value = v; sync(); };
sizeIn.addEventListener('input', () => setSize(sizeIn.value));
const setShape = k => { mat.uniforms.shape.value = k; blend();
  document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('on', +b.dataset.shape === k)); sync(); };
document.querySelectorAll('[data-shape]').forEach(b => b.addEventListener('click', () => setShape(+b.dataset.shape)));
const setKeep = v => { mat.uniforms.keep.value = v;
  document.querySelectorAll('[data-keep]').forEach(b => b.classList.toggle('on', +b.dataset.keep === v)); sync(); };
document.querySelectorAll('[data-keep]').forEach(b => b.addEventListener('click', () => setKeep(+b.dataset.keep)));
const spinBtn = document.getElementById('spin');
const setSpin = on => { controls.autoRotate = on; spinBtn.classList.toggle('on', on); sync(); };
spinBtn.addEventListener('click', () => setSpin(!controls.autoRotate));
const cityBtn = document.getElementById('city');
const setCity = on => { mat.uniforms.city.value = on ? 1 : 0; cityBtn.classList.toggle('on', on); sync(); };
document.querySelectorAll('[data-look]').forEach(b => b.addEventListener('click', () => setLook(b.dataset.look)));
cityBtn.addEventListener('click', () => setCity(!mat.uniforms.city.value));
setCity(hp.get('city') !== '0');
setSize(Math.min(3, Math.max(0.3, +(hp.get('size') || 1))));
setShape(Math.max(0, SHAPES.indexOf(hp.get('shape') || 'dot')));
setKeep([1, 0.5, 0.25].includes(+hp.get('points')) ? +hp.get('points') : 1);
setSpin(hp.get('spin') !== '0');
setLook(hp.get('look') || 'sun');
status.textContent = '';
// Light: a band of light rises through the landmark every 12 s; only the points light up
const lightBtn = document.getElementById('lightBtn');
var lightOn = false, last = 0;  // var: sync() can run before this line
const setLight = on => { lightOn = on; mat.uniforms.light.value = on ? 1 : 0; lightBtn.classList.toggle('on', on); sync(); };
lightBtn.addEventListener('click', () => setLight(!lightOn));
setLight(hp.get('light') === '1');
renderer.setAnimationLoop(now => {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
  if (lightOn) { const u = mat.uniforms; u.lphase.value = (u.lphase.value + dt / 12) % 1; }
  controls.update(); renderer.render(scene, camera);
});
</script></body></html>
